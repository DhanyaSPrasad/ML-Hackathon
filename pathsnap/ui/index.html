<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathSnap Evaluator</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:15px Arial;margin:24px;background:#f5f7fb;color:#172033}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between}select,button{padding:10px;border:1px solid #ccd3df;border-radius:7px}button{background:#2257b8;color:white;cursor:pointer}#map{height:560px;margin-top:18px;border-radius:10px}.stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.stat{background:white;padding:14px 20px;border-radius:8px;box-shadow:0 1px 5px #ccd3df}small{color:#58657a}</style></head><body><main><header><div><h1>PathSnap</h1><small>GPS map-matching and route reconstruction</small></div><div><select id="trip"></select> <button onclick="run()">Reconstruct route</button></div></header><div id="status">Connect to the API to load trips.</div><div class="stats" id="stats"></div><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API=new URLSearchParams(location.search).get('api')||'http://127.0.0.1:8000';let map=L.map('map').setView([49.8,8.6],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let layer=L.layerGroup().addTo(map);
async function load(){try{let r=await fetch(API+'/trips');let d=await r.json();document.getElementById('trip').innerHTML=d.trips.map(x=>`<option>${x}</option>`).join('');document.getElementById('status').textContent='API connected. Select a trip and reconstruct its route.'}catch(e){document.getElementById('status').textContent='Cannot reach API. Check Laptop 1 address and port 8000.'}}
async function run(){let id=document.getElementById('trip').value;document.getElementById('status').textContent='Processing '+id+'…';try{let r=await fetch(API+'/predict/'+id,{method:'POST'});let d=await r.json();if(!r.ok)throw Error(d.detail||'API error');layer.clearLayers();let gps=d.gps.map(p=>[p[1],p[0]]);L.polyline(gps,{color:'#2477d4',weight:2,opacity:.45,dashArray:'4 5'}).addTo(layer);let road=d.predicted_segments.flat().map(p=>[p[1],p[0]]);if(road.length)L.polyline(road,{color:'#15945b',weight:5}).addTo(layer);L.circleMarker(gps[0],{radius:6,color:'green'}).addTo(layer);L.circleMarker(gps[gps.length-1],{radius:6,color:'red'}).addTo(layer);map.fitBounds(L.latLngBounds(gps.concat(road)),{padding:[20,20]});document.getElementById('stats').innerHTML=`<div class="stat">Observations<br><b>${d.observations}</b></div><div class="stat">Internal pointwise accuracy<br><b>${d.accuracy_internal===null?'N/A':(100*d.accuracy_internal).toFixed(2)+'%'}</b></div><div class="stat">Route continuity<br><b>${(100*d.route_continuity).toFixed(2)}%</b></div>`;document.getElementById('status').textContent='Completed '+id+'. Ground-truth route is kept server-side.'}catch(e){document.getElementById('status').textContent='Error: '+e.message}}
load();</script></body></html>
